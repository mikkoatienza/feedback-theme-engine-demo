[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "feedback-theme-engine"
version = "0.1.0"
description = "Turn customer call transcripts into a living board of product themes: extraction, clustering, SQLite store, resolve/dismiss lifecycle, cost tracking and exports."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mikko Atienza"}]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
feedback-themes = "feedback_themes.cli:main"

[project.urls]
Homepage = "https://github.com/mikkoatienza/feedback-theme-engine-demo"

[tool.hatch.build.targets.wheel]
packages = ["src/feedback_themes"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["openai", "openai.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::ResourceWarning"]
addopts = "-q --cov=feedback_themes --cov-report=term-missing"
